name: CI_Parameter_Timer
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'tb'
  workflow_dispatch:

jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/Timer
      - name: push image to docker hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker push secrets.DOCKER_USERNAME/timer:v1.0
          
          
                
          
          

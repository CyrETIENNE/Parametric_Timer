name: CI_Parameter_Timer
on:
  push:
  workflow_dispatch:

jobs:
  Running_VUnit_Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Building Image
        run: docker build -t timer .
      - name: Tagging Image
        run: docker tag timer ${{ secrets.DOCKER_USERNAME }}/timer:v1.0
      - name: Pushing Image To Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker push ${{ secrets.DOCKER_USERNAME }}/timer:v1.0
      - name: Remove Local Existing Image
        run: |
          docker rmi ${{ secrets.DOCKER_USERNAME }}/timer:v1.0
      - name: Pulling Image
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/timer:v1.0
      - name: Running VUnit Tests
        run: docker run ${{ secrets.DOCKER_USERNAME }}/timer:v1.0        
          
          
                
          
          

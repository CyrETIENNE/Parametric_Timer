name: Run TImer_docker
on: push

jobs:
  compile:
    name: Compile assets
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker Part 1
        run: sudo apt remove docker docker-engine docker.io containerd runc
      - name: Install Docker Part 2
        run: sudo apt update
      - name: Install Docker Part 3
        run: sudo apt install -y ca-certificates curl gnupg lsb-release
      - name: Install Docker Part 4
        run: sudo mkdir -p /etc/apt/keyrings
      - name: Install Docker Part 5
        run: curl -fsSL https://download.docker.com/linux/ubuntu/gpg
      - name: Install Docker Part 6
        run: sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

          
          
                
          
          
